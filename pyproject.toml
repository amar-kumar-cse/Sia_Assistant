[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sia-assistant"
version = "2.0.0"
description = "Sia AI - Desktop Companion Assistant"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
    {name = "Amar Kumar"}
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: Microsoft :: Windows",
    "Topic :: Scientific/Engineering :: Artificial Intelligence"
]

dependencies = [
    "PyQt6>=6.4.0",
    "google-generativeai>=0.3.0",
    "python-dotenv>=1.0.0",
    "edge-tts>=6.1.0",
    "pygame>=2.1.0",
    "Pillow>=9.0.0",
    "pytesseract>=0.3.10",
    "requests>=2.28.0",
    "psutil>=5.9.0",
    "keyring>=24.0.0"
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "pytest-mock>=3.10.0",
    "black>=23.0.0",
    "flake8>=6.0.0",
    "mypy>=1.0.0",
    "pyinstaller>=5.10.0"
]

[tool.pytest.ini_options]
minversion = "7.0"
addopts = "-ra -q --import-mode=importlib"
testpaths = [
    "tests",
]

[tool.black]
line-length = 100
target-version = ['py310']
